name: "1. Fetch RSS"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-rss
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Backup & count articles
        run: |
          cp data/articles.json data/articles.backup.json
          ARTICLE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          echo "BEFORE_COUNT=$ARTICLE_COUNT" >> $GITHUB_ENV
          echo "📊 Articles before: $ARTICLE_COUNT"
      - run: node scripts/fetch-rss.js
      - name: Validate & Push
        run: |
          AFTER_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          echo "📊 Articles after: $AFTER_COUNT (was: $BEFORE_COUNT)"

          if [ "$AFTER_COUNT" -lt "$BEFORE_COUNT" ]; then
            echo "🚨 SAFETY: Article count dropped from $BEFORE_COUNT to $AFTER_COUNT! Restoring backup."
            cp data/articles.backup.json data/articles.json
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save the modified data file content
          cp data/articles.json /tmp/new-articles.json

          # Sync to latest remote (preserves OUR changes only via copy/paste)
          git fetch origin master
          git reset --hard origin/master

          # Restore our updated data
          cp /tmp/new-articles.json data/articles.json

          # Stage ONLY the data file (avoid clobbering anything else)
          git add data/articles.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: fetch rss"

          # Retry push up to 3 times in case of concurrent push
          for i in 1 2 3; do
            if git push origin master; then
              echo "PUSHED=true" >> $GITHUB_ENV
              break
            fi
            echo "Push attempt $i failed, syncing and retrying..."
            cp data/articles.json /tmp/new-articles.json
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/new-articles.json data/articles.json
            git add data/articles.json
            git diff --staged --quiet && echo "Already up to date after pull" && exit 0
            git commit --amend --no-edit
            sleep 3
          done

      # CHAIN: trigger translate immediately so new articles get translated ASAP
      - name: Chain → Translate
        if: env.PUSHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔗 Chaining to translate workflow"
          gh workflow run 3-translate.yml --repo "$GITHUB_REPOSITORY" || true
