name: "1. Fetch RSS"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-rss
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Backup & count articles
        run: |
          cp data/articles.json data/articles.backup.json
          ARTICLE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          echo "BEFORE_COUNT=$ARTICLE_COUNT" >> $GITHUB_ENV
          echo "📊 Articles before: $ARTICLE_COUNT"
      - run: node scripts/fetch-rss.js
      - name: Validate & Push
        run: |
          AFTER_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          echo "📊 Articles after: $AFTER_COUNT (was: $BEFORE_COUNT)"

          if [ "$AFTER_COUNT" -lt "$BEFORE_COUNT" ]; then
            echo "🚨 SAFETY: Article count dropped from $BEFORE_COUNT to $AFTER_COUNT! Restoring backup."
            cp data/articles.backup.json data/articles.json
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: fetch rss"
          git fetch origin master
          git reset --soft origin/master
          git add -A
          git diff --staged --quiet && echo "No net changes" && exit 0
          git commit -m "data: fetch rss"
          git push origin master
