name: "3. Translate"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: translate
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Backup & count articles
        run: |
          cp data/articles.json data/articles.backup.json
          ARTICLE_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          TRANSLATED=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.filter(x=>x.translated).length)")
          echo "BEFORE_COUNT=$ARTICLE_COUNT" >> $GITHUB_ENV
          echo "BEFORE_TRANSLATED=$TRANSLATED" >> $GITHUB_ENV
          echo "📊 Before: $ARTICLE_COUNT articles, $TRANSLATED translated"
      - name: Translate
        run: node scripts/translate.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Validate & Push
        run: |
          AFTER_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.length)")
          AFTER_TRANSLATED=$(node -e "const d=JSON.parse(require('fs').readFileSync('data/articles.json','utf8')); const a=Array.isArray(d)?d:d.articles||[]; console.log(a.filter(x=>x.translated).length)")
          echo "📊 After: $AFTER_COUNT articles, $AFTER_TRANSLATED translated (was: $BEFORE_COUNT, $BEFORE_TRANSLATED)"

          if [ "$AFTER_COUNT" -lt "$BEFORE_COUNT" ]; then
            echo "🚨 SAFETY: Article count dropped from $BEFORE_COUNT to $AFTER_COUNT! Restoring backup."
            cp data/articles.backup.json data/articles.json
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp data/articles.json /tmp/new-articles.json
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/new-articles.json data/articles.json

          git add data/articles.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: translate articles"

          for i in 1 2 3; do
            if git push origin master; then
              echo "PUSHED=true" >> $GITHUB_ENV
              break
            fi
            echo "Push attempt $i failed, syncing and retrying..."
            cp data/articles.json /tmp/new-articles.json
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/new-articles.json data/articles.json
            git add data/articles.json
            git diff --staged --quiet && echo "Already up to date after pull" && exit 0
            git commit --amend --no-edit
            sleep 3
          done

      # CHAIN: trigger build immediately so newly translated articles appear on site ASAP
      - name: Chain → Build & Deploy
        if: env.PUSHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔗 Chaining to build & deploy workflow"
          gh workflow run 4-build-deploy.yml --repo "$GITHUB_REPOSITORY" || true
